[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
# --ds as well, because an environment variable outranks the line above. The
# api container exports DJANGO_SETTINGS_MODULE=config.settings.dev, so running
# the suite inside Docker silently pointed at Postgres and the real cache and
# produced 34 setup errors that had nothing to do with the code.
addopts = --ds=config.settings.test
python_files = test_*.py
testpaths = apps common
