[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "migrations",   # generated by Django, not written by hand
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    # Django declares mutable class attributes everywhere (Meta.fields,
    # permission_classes, ...). This rule fights the framework.
    "RUF012",
    # Long lines are caught by line-length above; E501 duplicates it noisily
    # on generated strings and URLs.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules intentionally use star imports to layer configuration.
"config/settings/*.py" = ["F403", "F405"]
# Tests may shadow and reassign freely.
"**/tests/*.py" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]
