name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  backend:
    name: Backend (checks, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: python -m pip install --upgrade pip
      # dev.txt pulls in base.txt plus pytest — the prod set has no test runner.
      - run: pip install -r requirements/dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py check

      - name: Check for model changes with no migration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      # config.settings.test uses in-memory SQLite, so no database service is needed.
      - name: Tests
        run: python -m pytest -q
