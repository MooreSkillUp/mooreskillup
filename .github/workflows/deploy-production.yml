name: Deploy Production

# Deploys the Django API to Azure Container Apps.
#
# The frontend is NOT deployed here — it lives on Vercel, which builds from this
# repository on its own. Earlier versions of this workflow also built and pushed
# a `web` image to Azure, which meant paying for a second container app that
# nobody visited.
#
# Manual on purpose. Merging to main should never surprise real students; a
# person decides when production changes.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you mean production'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a half-finished deploy

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  RESOURCE_GROUP: rg-mooreskillup-prod
  ACR_NAME: acrmooreskillupprod
  CONTAINER_APP: mooreskillup-prod-api

jobs:
  verify:
    name: Verify before deploying
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Type 'deploy' to confirm. Got '${{ inputs.confirm }}'."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - run: pip install -r backend/requirements/dev.txt
        working-directory: backend

      # The same gates CI runs. Production deploys should never be the first
      # place a broken migration or a failing test is discovered.
      - name: Lint
        run: python -m ruff check .
        working-directory: backend

      - name: Tests
        run: python -m pytest -q
        working-directory: backend

      - name: Check for model changes with no migration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-secret-key
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production # add required reviewers here to gate deploys
    outputs:
      api_url: ${{ steps.urls.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built by the registry rather than a local docker build: no registry
      # credentials to store, and the source never leaves Azure.
      - name: Build the API image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "api:${{ github.sha }}" \
            --image "api:latest" \
            --file backend/docker/django/Dockerfile .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=production.terraform.tfstate"

      # Pinned to the commit's own image, so a deploy is reproducible and a
      # rollback is just re-running this workflow from an older commit.
      - name: Terraform apply
        working-directory: infrastructure/terraform
        run: |
          terraform apply -auto-approve \
            -var-file=environments/prod/terraform.tfvars \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}" \
            -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}" \
            -var="api_image=${{ env.ACR_NAME }}.azurecr.io/api:${{ github.sha }}"

      - name: Read the API URL
        id: urls
        working-directory: infrastructure/terraform
        run: echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      # The app scales to zero, so the first request wakes it. Retry rather than
      # calling a cold start a failure.
      - name: Smoke test
        run: |
          API="${{ steps.urls.outputs.api_url }}"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API/api/platform/status/" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::API did not return 200 after deploy"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **API:** ${{ steps.urls.outputs.api_url }}"
            echo "- **Image:** \`api:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
