name: Deploy

# Deploys the Django API to Azure Container Apps.
#
# The frontend is NOT deployed here — it lives on Vercel, which builds from this
# repository on its own. An earlier version of this workflow also pushed a `web`
# image to Azure, which meant paying for a second container app nobody visited.
#
# One environment: main is production. There is no staging, deliberately — a
# second environment means a second database, and that cost is not worth paying
# until there is something to protect. Add one when real students depend on the
# platform, not before.
#
# Runs automatically when main changes, and can be triggered by hand to redeploy
# or to roll back by running it from an older commit.

on:
  push:
    branches:
      - main
    # Docs and frontend-only changes do not need an API deploy. Vercel handles
    # the frontend itself.
    paths:
      - "backend/**"
      - "infrastructure/terraform/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a half-finished deploy

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ACR_NAME: acrmooreskillupprod

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - run: pip install -r requirements/dev.txt
        working-directory: backend

      # The same gates CI runs on the PR. Production should never be the first
      # place a broken migration or a failing test is discovered.
      - name: Lint
        run: python -m ruff check .
        working-directory: backend

      - name: Tests
        run: python -m pytest -q
        working-directory: backend

      - name: Check for model changes with no migration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-secret-key
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    # Deliberately no `environment:`. The OIDC token's subject changes when a
    # job runs in a named environment, and this repository already has
    # Vercel-created environments called "Production" and "Preview" — so a
    # lowercase `production` here could resolve to a differently-cased
    # environment and produce a subject the federated credential does not match.
    # Without it the subject is `repo:...:ref:refs/heads/main`, which is exactly
    # when this workflow runs.
    #
    # Add an environment later if deploys should need a reviewer's approval, and
    # register a federated credential for that exact name at the same time.
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built by the registry rather than a local docker build: no registry
      # credentials to store, and the source never leaves Azure.
      - name: Build the API image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "api:${{ github.sha }}" \
            --image "api:latest" \
            --file backend/docker/django/Dockerfile .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=production.terraform.tfstate"

      # Every value is passed explicitly rather than read from a tfvars file.
      # environments/prod/terraform.tfvars holds live credentials and is
      # gitignored, so it does not exist in a CI checkout — an earlier version
      # of this step pointed at it and failed on the first real deploy.
      #
      # Secrets come from GitHub secrets, everything else from repository
      # variables, so changing a domain is a settings edit rather than a code
      # change.
      #
      # The image is pinned to this commit's SHA, which makes a deploy
      # reproducible and a rollback just re-running this workflow from an
      # earlier commit.
      - name: Terraform apply
        working-directory: infrastructure/terraform
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ vars.TF_ENVIRONMENT }}" \
            -var="location=${{ vars.TF_LOCATION }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="django_allowed_hosts=${{ vars.DJANGO_ALLOWED_HOSTS }}" \
            -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            -var="frontend_url=${{ vars.FRONTEND_URL }}" \
            -var="next_public_api_url=${{ vars.NEXT_PUBLIC_API_URL }}" \
            -var="db_admin_username=${{ vars.DB_ADMIN_USERNAME }}" \
            -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}" \
            -var="django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}" \
            -var="api_image=${{ env.ACR_NAME }}.azurecr.io/api:${{ github.sha }}"

      - name: Read the API URL
        id: urls
        working-directory: infrastructure/terraform
        run: echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      # The app scales to zero, so the first request has to wake it. Retry
      # rather than calling a cold start a failed deploy.
      - name: Smoke test
        run: |
          API="${{ steps.urls.outputs.api_url }}"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API/api/platform/status/" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::API did not return 200 after deploy"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **API:** ${{ steps.urls.outputs.api_url }}"
            echo "- **Image:** \`api:${{ github.sha }}\`"
            echo ""
            echo "To roll back, re-run this workflow from an earlier commit."
          } >> "$GITHUB_STEP_SUMMARY"
