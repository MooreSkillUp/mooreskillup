name: Deploy Staging

# Deploys the Django API to a staging environment on Azure.
#
# MANUAL FOR NOW. This used to run on every push to main and failed every time,
# because it applied `environments/staging/terraform.tfvars.example` — a file of
# placeholders whose django_allowed_hosts is "staging-api.example.com". Staging
# would have rejected its own hostname even if the rest had worked.
#
# It also built and pushed a `web` image, which is wrong: the frontend is on
# Vercel and deploys itself. Paying for a second container app nobody visits is
# not a staging environment, it is a bill.
#
# To turn this back on for every merge, see docs/deployment/AZURE_OPERATIONS.md.
# Staging needs its own resource group, its own database (~$20/month more), and
# a deploy identity permitted to create resource groups. None of that is set up
# yet, so the trigger stays manual rather than failing on every merge.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ACR_NAME: acrmooreskillupstaging

jobs:
  preflight:
    name: Check staging is configured
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the staging secrets exist
        run: |
          missing=""
          [ -z "${{ secrets.STAGING_DB_PASSWORD }}" ] && missing="$missing STAGING_DB_PASSWORD"
          [ -z "${{ secrets.STAGING_DJANGO_SECRET_KEY }}" ] && missing="$missing STAGING_DJANGO_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Staging is not set up yet. Missing secrets:$missing"
            echo "See docs/deployment/AZURE_OPERATIONS.md for what staging needs."
            exit 1
          fi

  verify:
    name: Verify before deploying
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r backend/requirements/dev.txt
        working-directory: backend
      - name: Lint
        run: python -m ruff check .
        working-directory: backend
      - name: Tests
        run: python -m pytest -q
        working-directory: backend

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the API image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "api:${{ github.sha }}" \
            --file backend/docker/django/Dockerfile .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=staging.terraform.tfstate"

      - name: Terraform apply
        working-directory: infrastructure/terraform
        run: |
          terraform apply -auto-approve \
            -var-file=environments/staging/terraform.tfvars \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="django_secret_key=${{ secrets.STAGING_DJANGO_SECRET_KEY }}" \
            -var="db_admin_password=${{ secrets.STAGING_DB_PASSWORD }}" \
            -var="api_image=${{ env.ACR_NAME }}.azurecr.io/api:${{ github.sha }}"

      - name: Read the API URL
        id: urls
        working-directory: infrastructure/terraform
        run: echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          API="${{ steps.urls.outputs.api_url }}"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API/api/platform/status/" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Staging API did not return 200 after deploy"
          exit 1
